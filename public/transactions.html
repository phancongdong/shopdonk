<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử giao dịch - ShopGame</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">`n    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="logo" style="display:flex;align-items:center;gap:10px;">
                <div class="logo-icon" style="width:40px;height:40px;background:linear-gradient(135deg, #6366f1, #8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;">🎮</div>
                <div class="logo-text" style="font-size:24px;font-weight:800;color:#fff;">Shop<span style="color:#6366f1;">Game</span></div>
            </a>
        </div>
        <nav class="header-nav">
            <a href="index.html">Trang chủ</a>
            <a href="orders.html">Lịch sử Mua</a>
            <a href="deposit.html">Nạp tiền</a>
            <a href="transactions.html" class="active">Dòng Tiền</a>
            <a href="faq.html">FAQ</a>
        </nav>
        <div class="header-right">
            <div class="user-dropdown">
                <button class="user-btn" id="userBtn">
                    <span class="logo-text" style="font-size: 16px;">🎮 ShopGame</span>
                    <span class="user-balance" id="userBalance">0 ₫</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="profile.html"><i class="fas fa-user"></i> Thông tin tài khoản</a>
                    <a href="change-password.html"><i class="fas fa-key"></i> Đổi mật khẩu</a>
                    <a href="orders.html"><i class="fas fa-shopping-cart"></i> Đơn hàng</a>
                    <a href="deposit.html"><i class="fas fa-wallet"></i> Nạp tiền</a>
                    <a href="contact.html"><i class="fas fa-headset"></i> Liên hệ</a>
                    <a href="login.html" id="loginLink"><i class="fas fa-sign-in-alt"></i> Đăng nhập</a>
                    <a href="#" id="logoutBtn" style="display:none; color:#ef4444;"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
                </div>
            </div>
        </div>
    </header>

    <section class="content-section">
        <div class="page-header">
            <h1><i class="fas fa-exchange-alt"></i> Lịch sử Giao Dịch</h1>
        </div>
        <div id="transactionsContent">
            <div class="coming-soon">
                <i class="fas fa-sign-in-alt"></i>
                <h2>Vui lòng đăng nhập</h2>
                <p>Đăng nhập để xem Lịch sử giao dịch của bạn</p>
                <a href="login.html" class="btn-primary">Đăng nhập ngay</a>
            </div>
        </div>
    </section>

    <script>
        const API_BASE = window.location.origin + '/api';
        
        document.addEventListener('DOMContentLoaded', async function() {
            const userStr = localStorage.getItem('user');
            console.log('Raw user string from localStorage:', userStr);
            
            let user = null;
            if (userStr && userStr !== 'null' && userStr !== 'undefined') {
                try {
                    user = JSON.parse(userStr);
                    console.log('Parsed user object:', user);
                } catch (e) {
                    console.error('Error parsing user JSON:', e);
                    user = null;
                }
            }
            
            const transactionsContent = document.getElementById('transactionsContent');
            
            if (user && user.id) {
                console.log('User logged in with ID:', user.id);
                
                document.getElementById('loginLink').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
                
                const userBtn = document.getElementById('userBtn');
                if (userBtn) {
                    userBtn.innerHTML = `
                        <span style="color: #fff;">${user.name || 'User'}</span>
                        <span class="user-balance" id="userBalanceDisplay">0 ₫</span>
                        <i class="fas fa-chevron-down"></i>
                    `;
                }
                
                user = await syncBalance(user);
                const balanceEl = document.getElementById('userBalanceDisplay');
                if (balanceEl) {
                    balanceEl.textContent = formatPrice(user.balance || 0);
                }
                
                await loadTransactions(user);
            } else {
                console.log('No valid user found');
                document.getElementById('loginLink').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'none';
            }
            
            document.getElementById('logoutBtn').addEventListener('click', function(e) {
                e.preventDefault();
                localStorage.removeItem('user');
                localStorage.removeItem('token');
                location.href = 'login.html';
            });
        });
        
        async function syncBalance(user) {
            try {
                const res = await fetch(`${API_BASE}/auth/users`);
                const data = await res.json();
                if (data.success && data.users) {
                    const latestUser = data.users.find(u => u.id === user.id);
                    if (latestUser) {
                        user.balance = latestUser.balance || 0;
                        localStorage.setItem('user', JSON.stringify(user));
                        return user;
                    }
                }
            } catch (e) {
                console.error('Error syncing balance:', e);
            }
            return user;
        }
        
        async function loadTransactions(user) {
            const transactionsContent = document.getElementById('transactionsContent');
            
            try {
                const res = await fetch(`${API_BASE}/auth/transactions/${user.id}?limit=50`);
                const data = await res.json();
                
                if (data.success && data.data && data.data.length > 0) {
                    let html = `
                        <div style="background: rgba(30, 41, 59, 0.95); padding: 30px; border-radius: 20px; border: 1px solid rgba(0, 240, 255, 0.3);">
                            <h2 style="color: #fff; margin-bottom: 20px;"><i class="fas fa-exchange-alt"></i> Lịch sử giao dịch</h2>
                            <div style="overflow-x: auto;">
                                <table style="width: 100%; border-collapse: collapse;">
                                    <thead>
                                        <tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                                            <th style="padding: 15px; text-align: left; color: #94a3b8;">Loại</th>
                                            <th style="padding: 15px; text-align: left; color: #94a3b8;">Mô tả</th>
                                            <th style="padding: 15px; text-align: right; color: #94a3b8;">Số tiền</th>
                                            <th style="padding: 15px; text-align: right; color: #94a3b8;">Thời gian</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                    `;
                    
                    data.data.forEach(tx => {
                        const typeLabels = {
                            'deposit': { text: 'Nạp tiền', icon: 'fa-arrow-down', color: '#22c55e' },
                            'purchase': { text: 'Mua hàng', icon: 'fa-shopping-cart', color: '#ef4444' },
                            'refund': { text: 'Hoàn tiền', icon: 'fa-arrow-up', color: '#f59e0b' },
                            'withdraw': { text: 'Rút tiền', icon: 'fa-arrow-up', color: '#ef4444' }
                        };
                        
                        const typeInfo = typeLabels[tx.type] || { text: tx.type, icon: 'fa-exchange-alt', color: '#6366f1' };
                        const amountColor = tx.type === 'deposit' || tx.type === 'refund' ? '#22c55e' : '#ef4444';
                        const amountPrefix = tx.type === 'deposit' || tx.type === 'refund' ? '+' : '-';
                        
                        html += `
                            <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                                <td style="padding: 15px; color: ${typeInfo.color};">
                                    <i class="fas ${typeInfo.icon}"></i> ${typeInfo.text}
                                </td>
                                <td style="padding: 15px; color: #fff; max-width: 300px; overflow: hidden; text-overflow: ellipsis;">
                                    ${tx.description || 'N/A'}
                                </td>
                                <td style="padding: 15px; text-align: right; color: ${amountColor}; font-weight: 600;">
                                    ${amountPrefix}${formatPrice(tx.amount)}
                                </td>
                                <td style="padding: 15px; text-align: right; color: #94a3b8;">
                                    ${formatDate(tx.created_at)}
                                </td>
                            </tr>
                        `;
                    });
                    
                    html += `
                                    </tbody>
                                </table>
                            </div>
                            <div style="margin-top: 20px; text-align: center;">
                                <a href="deposit.html" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px 30px; border-radius: 10px; display: inline-block; text-decoration: none;">
                                    <i class="fas fa-wallet"></i> Nạp tiền
                                </a>
                            </div>
                        </div>
                    `;
                    
                    transactionsContent.innerHTML = html;
                } else {
                    transactionsContent.innerHTML = `
                        <div style="background: rgba(30, 41, 59, 0.95); padding: 30px; border-radius: 20px; border: 1px solid rgba(0, 240, 255, 0.3);">
                            <h2 style="color: #fff; margin-bottom: 20px;"><i class="fas fa-exchange-alt"></i> Lịch sử giao dịch</h2>
                            <div style="text-align: center; padding: 40px; color: #a0aec0;">
                                <i class="fas fa-receipt" style="font-size: 50px; color: var(--primary); margin-bottom: 20px;"></i>
                                <p>bạn chưa có giao dịch nào</p>
                                <a href="deposit.html" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px 30px; border-radius: 10px; display: inline-block; margin-top: 20px; text-decoration: none;">Nạp tiền ngay</a>
                            </div>
                        </div>
                    `;
                }
            } catch (e) {
                console.error('Error loading transactions:', e);
                transactionsContent.innerHTML = `
                    <div style="background: rgba(30, 41, 59, 0.95); padding: 30px; border-radius: 20px; border: 1px solid rgba(0, 240, 255, 0.3);">
                        <h2 style="color: #fff; margin-bottom: 20px;"><i class="fas fa-exchange-alt"></i> Lịch sử giao dịch</h2>
                        <div style="text-align: center; padding: 40px; color: #ef4444;">
                            <i class="fas fa-exclamation-triangle" style="font-size: 50px; margin-bottom: 20px;"></i>
                            <p>Có lỗi xảy ra khi tải dữ liệu</p>
                            <button onclick="location.reload()" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px 30px; border-radius: 10px; margin-top: 20px; border: none; cursor: pointer;">
                                <i class="fas fa-redo"></i> Tải lại
                            </button>
                        </div>
                    </div>
                `;
            }
        }
        
        function formatPrice(price) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND', maximumFractionDigits: 0 }).format(price || 0);
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr);
            return new Intl.DateTimeFormat('vi-VN', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            }).format(date);
        }
    </script>
</body>
</html>
