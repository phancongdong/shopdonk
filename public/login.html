<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - ShopDonk</title>
    <meta name="description" content="Đăng nhập tài khoản ShopDonk để mua bán tài khoản game uy tín với giá tốt nhất.">
    <meta name="keywords" content="đăng nhập shopdonk, login, đăng nhập mua acc game">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://shopdonk.com/login.html">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
    <meta property="og:title" content="Đăng nhập - ShopDonk">
    <meta property="og:description" content="Đăng nhập tài khoản ShopDonk để mua bán tài khoản game uy tín">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <meta name="google-signin-client_id" content="178643627427-1qkjf2obrdkdivkp4jkdat7uf2fbrlrf.apps.googleusercontent.com">
</head>
<body class="auth-page">
    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <span class="logo-text">🎮 ShopDonk</span>
                </a>
                <h1>Đăng nhập</h1>
                <p>Chào mừng bạn quay trở lại!</p>
            </div>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        Tên đăng nhập
                    </label>
                    <input type="text" id="username" name="username" placeholder="nhập tên đăng nhập" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        mật khẩu
                    </label>
                    <input type="password" id="password" name="password" placeholder="nhập mật khẩu" required>
                    <button type="button" class="toggle-password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="forgot-password.html" class="forgot-link">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="auth-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Đăng nhập
                </button>

                <div class="auth-divider">
                    <span>hoặc đăng nhập với</span>
                </div>

                <div class="social-auth">
                    <button type="button" class="social-btn google" onclick="handleGoogleSignIn()">
                        <i class="fab fa-google"></i>
                        Google
                    </button>
                    <button type="button" class="social-btn facebook" style="display:none;">
                        <i class="fab fa-facebook-f"></i>
                        Facebook
                    </button>
                </div>

                <p class="auth-footer">
                    Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
                </p>
                
                <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); text-align: center;">
                    <a href="faq.html" style="color: #a0aec0; font-size: 14px; margin: 0 10px;"><i class="fas fa-question-circle"></i> FAQ</a>
                    <a href="contact.html" style="color: #a0aec0; font-size: 14px; margin: 0 10px;"><i class="fas fa-headset"></i> Liên hệ</a>
                    <a href="terms.html" style="color: #a0aec0; font-size: 14px; margin: 0 10px;"><i class="fas fa-file-contract"></i> Điều khoản</a>
                </div>
            </form>
        </div>
    </div>
    
    <script src="js/seo-loader.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/particles.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Simple entrance animation - no opacity changes
            if (typeof gsap !== 'undefined') {
                gsap.from('.auth-card', {
                    y: 30,
                    duration: 0.8,
                    ease: "back.out(1.7)"
                });
                
                gsap.from('.auth-header', {
                    y: -20,
                    duration: 0.6,
                    delay: 0.2
                });
                
                gsap.from('.form-group', {
                    x: -20,
                    stagger: 0.1,
                    duration: 0.4,
                    delay: 0.3
                });
                
                gsap.from('.auth-btn', {
                    scale: 0.95,
                    duration: 0.4,
                    delay: 0.6,
                    ease: "power2.out"
                });
                
                gsap.from('.social-btn', {
                    y: 15,
                    stagger: 0.08,
                    duration: 0.3,
                    delay: 0.7
                });
            }
        });
    </script>
</body>
</body>
</html>
