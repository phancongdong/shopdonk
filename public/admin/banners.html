<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Banner - Admin ShopDonk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        
        /* Header */
        header { background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
        .logo span { color: #6366f1; }
        .back-btn { color: #94a3b8; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: color 0.3s; }
        .back-btn:hover { color: #6366f1; }
        
        /* Content */
        .content { padding: 30px 20px; }
        .page-header { margin-bottom: 30px; }
        .page-header h1 { font-size: 28px; margin-bottom: 10px; }
        .page-header p { color: #94a3b8; }
        
        /* Banner Grid */
        .banner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(500px, 1fr)); gap: 25px; }
        .banner-card { background: linear-gradient(135deg, #1a1a2e, #16213e); border: 1px solid rgba(99,102,241,0.2); border-radius: 16px; overflow: hidden; }
        .banner-preview { position: relative; height: 200px; background: rgba(99,102,241,0.1); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .banner-preview img { width: 100%; height: 100%; object-fit: cover; }
        .banner-preview .placeholder { color: #64748b; text-align: center; }
        .banner-preview .placeholder i { font-size: 48px; margin-bottom: 10px; }
        .banner-status { position: absolute; top: 15px; right: 15px; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .banner-status.active { background: #22c55e; color: #fff; }
        .banner-status.inactive { background: rgba(255,255,255,0.2); color: #fff; }
        
        .banner-info { padding: 20px; }
        .banner-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .banner-desc { color: #94a3b8; font-size: 14px; margin-bottom: 15px; }
        .banner-url { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; font-size: 12px; color: #6366f1; word-break: break-all; }
        
        .banner-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); }
        .btn-danger { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
        .btn-danger:hover { background: rgba(239,68,68,0.3); }
        
        /* Add Banner Card */
        .add-banner-card { border: 2px dashed rgba(99,102,241,0.3); background: transparent; display: flex; align-items: center; justify-content: center; min-height: 300px; cursor: pointer; transition: all 0.3s; }
        .add-banner-card:hover { border-color: #6366f1; background: rgba(99,102,241,0.05); }
        .add-banner-content { text-align: center; color: #94a3b8; }
        .add-banner-content i { font-size: 48px; margin-bottom: 15px; color: #6366f1; }
        .add-banner-content h3 { font-size: 18px; margin-bottom: 8px; color: #fff; }
        
        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-content { background: linear-gradient(135deg, #1a1a2e, #16213e); border: 1px solid rgba(99,102,241,0.3); border-radius: 20px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; }
        .modal-header h2 { font-size: 22px; }
        .modal-close { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
        .modal-close:hover { color: #fff; }
        .modal-body { padding: 25px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #fff; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 15px; transition: all 0.3s; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #6366f1; }
        .form-group textarea { min-height: 100px; resize: vertical; }
        
        .file-upload { border: 2px dashed rgba(99,102,241,0.3); border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .file-upload:hover { border-color: #6366f1; background: rgba(99,102,241,0.05); }
        .file-upload i { font-size: 36px; color: #6366f1; margin-bottom: 10px; }
        .file-upload p { color: #94a3b8; font-size: 14px; }
        .file-upload input { display: none; }
        
        .preview-image { margin-top: 15px; border-radius: 10px; overflow: hidden; display: none; }
        .preview-image img { width: 100%; max-height: 200px; object-fit: cover; }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        .checkbox-group input { width: 20px; height: 20px; }
        
        .modal-footer { padding: 20px 25px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 15px; justify-content: flex-end; }
        
        /* Toast */
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #fff; padding: 12px 24px; border-radius: 10px; font-weight: 600; z-index: 99999; }
        .toast.error { background: #ef4444; }
        
        @media (max-width: 768px) {
            .banner-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Quay lại</a>
        <div class="logo">🎮 Shop<span>Donk</span></div>
        <div></div>
    </header>
    
    <div class="content container">
        <div class="page-header">
            <h1><i class="fas fa-images"></i> Quản lý Banner</h1>
            <p>Quản lý banner hiển thị trên trang chủ</p>
        </div>
        
        <div class="banner-grid" id="bannerGrid">
            <div class="banner-card add-banner-card" onclick="openAddModal()">
                <div class="add-banner-content">
                    <i class="fas fa-plus-circle"></i>
                    <h3>Thêm banner mới</h3>
                    <p>Click để thêm banner</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Add/Edit -->
    <div class="modal-overlay" id="bannerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Thêm banner mới</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="bannerForm">
                <div class="modal-body">
                    <input type="hidden" id="bannerId">
                    
                    <div class="form-group">
                        <label>Tiêu đề</label>
                        <input type="text" id="bannerTitle" placeholder="Nhập tiêu đề banner" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Mô tả</label>
                        <textarea id="bannerDesc" placeholder="Nhập mô tả (tùy chọn)"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Link điều hướng (tùy chọn)</label>
                        <input type="url" id="bannerLink" placeholder="https://...">
                    </div>
                    
                    <div class="form-group">
                        <label>Hình ảnh</label>
                        <div class="file-upload" onclick="document.getElementById('bannerImage').click()">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Click để chọn ảnh hoặc kéo thả vào đây</p>
                            <input type="file" id="bannerImage" accept="image/*" onchange="previewFile(this)">
                        </div>
                        <div class="preview-image" id="previewContainer">
                            <img id="previewImg" src="" alt="Preview">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Hoặc nhập URL ảnh</label>
                        <input type="url" id="bannerImageUrl" placeholder="https://..." oninput="previewUrl(this.value)">
                    </div>
                    
                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="bannerActive" checked>
                            <label for="bannerActive" style="margin:0;">Kích hoạt banner</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Lưu</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="js/admin-check.js"></script>
    <script>
        const API_BASE = window.location.origin + '/api';
        let banners = [];
        let imageData = '';
        
        document.addEventListener('DOMContentLoaded', loadBanners);
        
        async function loadBanners() {
            try {
                const res = await fetch(`${API_BASE}/banners/all`);
                const data = await res.json();
                if (data.success) {
                    banners = data.data || [];
                    renderBanners();
                }
            } catch (e) {
                console.error('Error loading banners:', e);
            }
        }
        
        function renderBanners() {
            const grid = document.getElementById('bannerGrid');
            
            grid.innerHTML = '';
            
            banners.forEach(banner => {
                const card = document.createElement('div');
                card.className = 'banner-card';
                card.innerHTML = `
                    <div class="banner-preview">
                        <img src="${banner.image}" alt="${banner.title}" onerror="this.src='https://placehold.co/500x200/6366f1/fff?text=Banner'">
                        <span class="banner-status ${banner.active ? 'active' : 'inactive'}">${banner.active ? 'Đang hiển thị' : 'Đã tắt'}</span>
                    </div>
                    <div class="banner-info">
                        <div class="banner-title">${banner.title}</div>
                        <div class="banner-desc">${banner.description || 'Không có mô tả'}</div>
                        ${banner.link ? `<div class="banner-url"><i class="fas fa-link"></i> ${banner.link}</div>` : ''}
                        <div class="banner-actions">
                            <button class="btn btn-primary" onclick="editBanner(${banner.id})"><i class="fas fa-edit"></i> Sửa</button>
                            <button class="btn ${banner.active ? 'btn-secondary' : 'btn-primary'}" onclick="toggleBanner(${banner.id})">
                                <i class="fas fa-${banner.active ? 'eye-slash' : 'eye'}"></i> ${banner.active ? 'Tắt' : 'Bật'}
                            </button>
                            <button class="btn btn-danger" onclick="deleteBanner(${banner.id})"><i class="fas fa-trash"></i> Xóa</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            const addCard = document.createElement('div');
            addCard.className = 'banner-card add-banner-card';
            addCard.onclick = openAddModal;
            addCard.innerHTML = `
                <div class="add-banner-content">
                    <i class="fas fa-plus-circle"></i>
                    <h3>Thêm banner mới</h3>
                    <p>Click để thêm banner</p>
                </div>
            `;
            grid.appendChild(addCard);
        }
        
        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Thêm banner mới';
            document.getElementById('bannerForm').reset();
            document.getElementById('bannerId').value = '';
            document.getElementById('previewContainer').style.display = 'none';
            document.getElementById('bannerActive').checked = true;
            imageData = '';
            document.getElementById('bannerModal').style.display = 'flex';
        }
        
        function editBanner(id) {
            const banner = banners.find(b => b.id === id);
            if (!banner) return;
            
            document.getElementById('modalTitle').textContent = 'Sửa banner';
            document.getElementById('bannerId').value = banner.id;
            document.getElementById('bannerTitle').value = banner.title;
            document.getElementById('bannerDesc').value = banner.description || '';
            document.getElementById('bannerLink').value = banner.link || '';
            document.getElementById('bannerImageUrl').value = banner.image || '';
            document.getElementById('bannerActive').checked = banner.active;
            
            if (banner.image) {
                document.getElementById('previewImg').src = banner.image;
                document.getElementById('previewContainer').style.display = 'block';
            }
            
            imageData = banner.image || '';
            document.getElementById('bannerModal').style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('bannerModal').style.display = 'none';
        }
        
        function previewFile(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imageData = e.target.result;
                    document.getElementById('previewImg').src = imageData;
                    document.getElementById('previewContainer').style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        
        function previewUrl(url) {
            if (url) {
                imageData = url;
                document.getElementById('previewImg').src = url;
                document.getElementById('previewContainer').style.display = 'block';
            }
        }
        
        document.getElementById('bannerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const id = document.getElementById('bannerId').value;
            const banner = {
                title: document.getElementById('bannerTitle').value,
                description: document.getElementById('bannerDesc').value,
                link: document.getElementById('bannerLink').value,
                image: imageData || document.getElementById('bannerImageUrl').value || 'https://placehold.co/1400x400/6366f1/fff?text=Banner',
                active: document.getElementById('bannerActive').checked,
                display_order: 0
            };
            
            try {
                const url = id ? `${API_BASE}/banners/${id}` : `${API_BASE}/banners`;
                const method = id ? 'PUT' : 'POST';
                
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(banner)
                });
                
                const result = await res.json();
                
                if (result.success) {
                    closeModal();
                    loadBanners();
                    showToast(id ? 'Cập nhật banner thành công!' : 'Thêm banner thành công!');
                } else {
                    showToast(result.message || 'Lỗi!', 'error');
                }
            } catch (error) {
                console.error('Error saving banner:', error);
                showToast('Có lỗi xảy ra!', 'error');
            }
        });
        
        async function toggleBanner(id) {
            const banner = banners.find(b => b.id === id);
            if (banner) {
                banner.active = !banner.active;
                
                try {
                    await fetch(`${API_BASE}/banners/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(banner)
                    });
                    
                    loadBanners();
                    showToast(banner.active ? 'Đã bật banner' : 'Đã tắt banner');
                } catch (error) {
                    console.error('Error toggling banner:', error);
                    showToast('Có lỗi xảy ra!', 'error');
                }
            }
        }
        
        async function deleteBanner(id) {
            if (confirm('Bạn có chắc muốn xóa banner này?')) {
                try {
                    await fetch(`${API_BASE}/banners/${id}`, { method: 'DELETE' });
                    loadBanners();
                    showToast('Đã xóa banner');
                } catch (error) {
                    console.error('Error deleting banner:', error);
                    showToast('Có lỗi xảy ra!', 'error');
                }
            }
        }
        
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
