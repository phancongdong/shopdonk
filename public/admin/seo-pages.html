<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>Quản lý SEO Trang - ShopDonk Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 500: '#0ea5e9', 600: '#0284c7' } } } } }</script>
</head>
<body class="bg-gray-100 dark:bg-gray-900" x-data="{ darkMode: true, activeTab: 'pages' }" x-init="darkMode = JSON.parse(localStorage.getItem('darkMode') || 'true')" :class="{ 'dark': darkMode }">
    <div class="flex h-screen overflow-hidden">
        <aside class="fixed left-0 top-0 z-50 flex h-screen w-72 flex-col overflow-y-hidden border-r border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-950">
            <div class="px-6 py-5 border-b border-gray-200 dark:border-gray-800">
                <a href="../index.html" class="flex items-center gap-2"><span class="text-2xl">🎮</span><span class="text-xl font-bold text-gray-900 dark:text-white">ShopDonk</span></a>
            </div>
            <nav class="flex-1 overflow-y-auto px-4 py-4">
                <ul class="space-y-1">
                    <li><a href="index.html" class="flex items-center gap-3 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-100 dark:text-gray-300"><i class="fas fa-chart-line"></i>Dashboard</a></li>
                    <li class="admin-only"><a href="users.html" class="flex items-center gap-3 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-100 dark:text-gray-300"><i class="fas fa-users"></i>Người dùng</a></li>
                    <li><a href="products.html" class="flex items-center gap-3 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-100 dark:text-gray-300"><i class="fas fa-box"></i>Sản phẩm</a></li>
                    <li><a href="orders.html" class="flex items-center gap-3 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-100 dark:text-gray-300"><i class="fas fa-shopping-cart"></i>Đơn hàng</a></li>
                    <li class="admin-only"><a href="deposits.html" class="flex items-center gap-3 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-100 dark:text-gray-300"><i class="fas fa-wallet"></i>Nạp tiền</a></li>
                    <li class="admin-only"><a href="categories.html" class="flex items-center gap-3 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-100 dark:text-gray-300"><i class="fas fa-folder"></i>Danh mục</a></li>
                    <li class="admin-only"><a href="banners.html" class="flex items-center gap-3 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-100 dark:text-gray-300"><i class="fas fa-images"></i>Banner</a></li>
                    <li class="admin-only"><a href="uploads.html" class="flex items-center gap-3 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-100 dark:text-gray-300"><i class="fas fa-cloud-upload-alt"></i>Hình ảnh</a></li>
                    <li class="admin-only"><a href="social-links.html" class="flex items-center gap-3 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-100 dark:text-gray-300"><i class="fas fa-share-alt"></i>Mạng xã hội</a></li>
                    <li class="admin-only"><a href="payment-settings.html" class="flex items-center gap-3 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-100 dark:text-gray-300"><i class="fas fa-credit-card"></i>Thanh toán</a></li>
                    <li><a href="seo.html" class="flex items-center gap-3 rounded-lg bg-brand-50 px-4 py-3 text-brand-600"><i class="fas fa-search"></i>SEO</a></li>
                </ul>
                <ul class="space-y-1 mt-6">
                    <li><a href="../index.html" class="flex items-center gap-3 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-100 dark:text-gray-300"><i class="fas fa-globe"></i>Xem trang web</a></li>
                    <li><a href="#" onclick="localStorage.clear(); window.location.href='../login.html'" class="flex items-center gap-3 rounded-lg px-4 py-3 text-red-600"><i class="fas fa-sign-out-alt"></i>Đăng xuất</a></li>
                </ul>
            </nav>
        </aside>
        
        <div class="flex flex-1 flex-col overflow-hidden ml-72">
            <header class="flex items-center justify-between border-b border-gray-200 bg-white px-6 py-4 dark:border-gray-800 dark:bg-gray-950">
                <h1 class="text-xl font-semibold text-gray-900 dark:text-white">Quản lý SEO</h1>
                <button @click="darkMode = !darkMode" class="rounded-lg p-2 text-gray-500 hover:bg-gray-100"><i class="fas fa-moon" x-show="!darkMode"></i><i class="fas fa-sun" x-show="darkMode"></i></button>
            </header>
            
            <main class="flex-1 overflow-y-auto bg-gray-50 p-6 dark:bg-gray-900">
                <div class="max-w-6xl mx-auto">
                    <!-- Tabs -->
                    <div class="flex gap-4 mb-6">
                        <button @click="activeTab = 'pages'" :class="activeTab === 'pages' ? 'bg-brand-500 text-white' : 'bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium">
                            <i class="fas fa-file-alt mr-2"></i>Trang
                        </button>
                        <button @click="activeTab = 'categories'" :class="activeTab === 'categories' ? 'bg-brand-500 text-white' : 'bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium">
                            <i class="fas fa-folder mr-2"></i>Danh mục
                        </button>
                        <a href="seo.html" class="px-4 py-2 rounded-lg font-medium bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300">
                            <i class="fas fa-cog mr-2"></i>Cài đặt chung
                        </a>
                    </div>
                    
                    <!-- Pages SEO -->
                    <div x-show="activeTab === 'pages'" class="space-y-4">
                        <div id="pagesList"></div>
                    </div>
                    
                    <!-- Categories SEO -->
                    <div x-show="activeTab === 'categories'" class="space-y-4">
                        <div id="categoriesList"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <!-- Edit Modal -->
    <div id="editModal" class="fixed inset-0 z-50 hidden">
        <div class="flex items-center justify-center min-h-screen px-4">
            <div class="fixed inset-0 bg-black opacity-75" onclick="closeModal()"></div>
            <div class="bg-white dark:bg-gray-900 rounded-lg shadow-xl relative z-10 w-full max-w-3xl max-h-[90vh] overflow-y-auto p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="modalTitle" class="text-xl font-bold text-gray-900 dark:text-white">Chỉnh sửa SEO</h2>
                    <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700"><i class="fas fa-times text-xl"></i></button>
                </div>
                <form id="seoForm" class="space-y-4">
                    <input type="hidden" id="editId">
                    <input type="hidden" id="editType">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Tiêu đề (Title)</label>
                        <input type="text" id="editTitle" class="w-full px-3 py-2 border border-gray-300 rounded-lg dark:bg-gray-800 dark:border-gray-700 dark:text-white">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Mô tả (Description)</label>
                        <textarea id="editDescription" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg dark:bg-gray-800 dark:border-gray-700 dark:text-white"></textarea>
                        <p class="text-xs text-gray-500 mt-1">Tối đa 160 ký tự cho Google</p>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Từ khóa (Keywords)</label>
                        <input type="text" id="editKeywords" class="w-full px-3 py-2 border border-gray-300 rounded-lg dark:bg-gray-800 dark:border-gray-700 dark:text-white" placeholder="từ khóa 1, từ khóa 2, ...">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">OG Title</label>
                            <input type="text" id="editOgTitle" class="w-full px-3 py-2 border border-gray-300 rounded-lg dark:bg-gray-800 dark:border-gray-700 dark:text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">OG Image URL</label>
                            <input type="text" id="editOgImage" class="w-full px-3 py-2 border border-gray-300 rounded-lg dark:bg-gray-800 dark:border-gray-700 dark:text-white">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">OG Description</label>
                        <textarea id="editOgDescription" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg dark:bg-gray-800 dark:border-gray-700 dark:text-white"></textarea>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Canonical URL</label>
                        <input type="text" id="editCanonical" class="w-full px-3 py-2 border border-gray-300 rounded-lg dark:bg-gray-800 dark:border-gray-700 dark:text-white" placeholder="https://shopdonk.com/...">
                    </div>
                    
                    <div class="flex gap-4">
                        <label class="flex items-center gap-2">
                            <input type="checkbox" id="editNoindex" class="w-4 h-4">
                            <span class="text-sm text-gray-700 dark:text-gray-300">Noindex (ẩn khỏi Google)</span>
                        </label>
                        <label class="flex items-center gap-2">
                            <input type="checkbox" id="editNofollow" class="w-4 h-4">
                            <span class="text-sm text-gray-700 dark:text-gray-300">Nofollow</span>
                        </label>
                    </div>
                    
                    <div class="flex justify-end gap-3 pt-4">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg">Hủy</button>
                        <button type="submit" class="px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white rounded-lg"><i class="fas fa-save mr-2"></i>Lưu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <div id="toast" class="fixed bottom-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg hidden z-50">
        <span id="toastMessage"></span>
    </div>
    
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        const API_BASE = window.location.origin + '/api';
        let currentUser = JSON.parse(localStorage.getItem('user') || 'null');
        let pagesData = [];
        let categoriesData = [];
        
        if (!currentUser || currentUser.role !== 'admin') {
            alert('Bạn không có quyền truy cập!');
            window.location.href = '../index.html';
        }
        
        async function loadPages() {
            try {
                const res = await fetch(`${API_BASE}/seo/pages`, {
                    headers: { 'x-user': JSON.stringify(currentUser) }
                });
                const data = await res.json();
                if (data.success) {
                    pagesData = data.data || [];
                    renderPages();
                }
            } catch (error) {
                console.error('Load pages error:', error);
            }
        }
        
        async function loadCategories() {
            try {
                const res = await fetch(`${API_BASE}/seo/categories`, {
                    headers: { 'x-user': JSON.stringify(currentUser) }
                });
                const data = await res.json();
                if (data.success) {
                    categoriesData = data.data || [];
                    renderCategories();
                }
            } catch (error) {
                console.error('Load categories error:', error);
            }
        }
        
        function renderPages() {
            const container = document.getElementById('pagesList');
            
            if (pagesData.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-8">Không có dữ liệu</p>';
                return;
            }
            
            container.innerHTML = pagesData.map(page => `
                <div class="bg-white dark:bg-gray-800 rounded-lg p-4 flex items-center justify-between">
                    <div class="flex-1">
                        <h3 class="font-semibold text-gray-900 dark:text-white">${page.page_name}</h3>
                        <p class="text-sm text-gray-500">${page.title || 'Chưa có tiêu đề'}</p>
                        <div class="flex gap-2 mt-2">
                            ${page.noindex ? '<span class="text-xs bg-yellow-100 text-yellow-700 px-2 py-1 rounded">Noindex</span>' : ''}
                            ${page.title ? '<span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded">Đã thiết lập</span>' : '<span class="text-xs bg-red-100 text-red-700 px-2 py-1 rounded">Chưa thiết lập</span>'}
                        </div>
                    </div>
                    <button onclick="editPage('${page.page_name}')" class="px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white rounded-lg">
                        <i class="fas fa-edit"></i>
                    </button>
                </div>
            `).join('');
        }
        
        function renderCategories() {
            const container = document.getElementById('categoriesList');
            
            if (categoriesData.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-8">Không có danh mục</p>';
                return;
            }
            
            container.innerHTML = categoriesData.map(cat => `
                <div class="bg-white dark:bg-gray-800 rounded-lg p-4 flex items-center justify-between">
                    <div class="flex-1">
                        <h3 class="font-semibold text-gray-900 dark:text-white">${cat.category_name}</h3>
                        <p class="text-sm text-gray-500">${cat.title || 'Chưa có tiêu đề SEO'}</p>
                        <div class="flex gap-2 mt-2">
                            ${cat.noindex ? '<span class="text-xs bg-yellow-100 text-yellow-700 px-2 py-1 rounded">Noindex</span>' : ''}
                            ${cat.title ? '<span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded">Đã thiết lập</span>' : '<span class="text-xs bg-red-100 text-red-700 px-2 py-1 rounded">Chưa thiết lập</span>'}
                        </div>
                    </div>
                    <button onclick="editCategory(${cat.category_id})" class="px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white rounded-lg">
                        <i class="fas fa-edit"></i>
                    </button>
                </div>
            `).join('');
        }
        
        function editPage(pageName) {
            const page = pagesData.find(p => p.page_name === pageName);
            if (!page) return;
            
            document.getElementById('editId').value = pageName;
            document.getElementById('editType').value = 'page';
            document.getElementById('modalTitle').textContent = `Chỉnh sửa SEO: ${pageName}`;
            document.getElementById('editTitle').value = page.title || '';
            document.getElementById('editDescription').value = page.description || '';
            document.getElementById('editKeywords').value = page.keywords || '';
            document.getElementById('editOgTitle').value = page.og_title || '';
            document.getElementById('editOgDescription').value = page.og_description || '';
            document.getElementById('editOgImage').value = page.og_image || '';
            document.getElementById('editCanonical').value = page.canonical_url || '';
            document.getElementById('editNoindex').checked = page.noindex || false;
            document.getElementById('editNofollow').checked = page.nofollow || false;
            
            document.getElementById('editModal').classList.remove('hidden');
        }
        
        function editCategory(categoryId) {
            const cat = categoriesData.find(c => c.category_id === categoryId);
            if (!cat) return;
            
            document.getElementById('editId').value = categoryId;
            document.getElementById('editType').value = 'category';
            document.getElementById('modalTitle').textContent = `Chỉnh sửa SEO: ${cat.category_name}`;
            document.getElementById('editTitle').value = cat.title || '';
            document.getElementById('editDescription').value = cat.description || '';
            document.getElementById('editKeywords').value = cat.keywords || '';
            document.getElementById('editOgTitle').value = cat.og_title || '';
            document.getElementById('editOgDescription').value = cat.og_description || '';
            document.getElementById('editOgImage').value = cat.og_image || '';
            document.getElementById('editCanonical').value = cat.canonical_url || '';
            document.getElementById('editNoindex').checked = cat.noindex || false;
            document.getElementById('editNofollow').checked = cat.nofollow || false;
            
            document.getElementById('editModal').classList.remove('hidden');
        }
        
        function closeModal() {
            document.getElementById('editModal').classList.add('hidden');
        }
        
        document.getElementById('seoForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const editId = document.getElementById('editId').value;
            const editType = document.getElementById('editType').value;
            
            const data = {
                title: document.getElementById('editTitle').value,
                description: document.getElementById('editDescription').value,
                keywords: document.getElementById('editKeywords').value,
                og_title: document.getElementById('editOgTitle').value,
                og_description: document.getElementById('editOgDescription').value,
                og_image: document.getElementById('editOgImage').value,
                canonical_url: document.getElementById('editCanonical').value,
                noindex: document.getElementById('editNoindex').checked,
                nofollow: document.getElementById('editNofollow').checked
            };
            
            try {
                const url = editType === 'page' 
                    ? `${API_BASE}/seo/page/${editId}`
                    : `${API_BASE}/seo/category/${editId}`;
                
                const res = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user': JSON.stringify(currentUser)
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await res.json();
                
                if (result.success) {
                    showToast('Đã lưu thành công!');
                    closeModal();
                    if (editType === 'page') loadPages();
                    else loadCategories();
                } else {
                    showToast(result.message || 'Lỗi!', 'error');
                }
            } catch (error) {
                console.error('Save error:', error);
                showToast('Có lỗi xảy ra!', 'error');
            }
        });
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toast.className = `fixed bottom-4 right-4 px-4 py-2 rounded-lg shadow-lg z-50 ${type === 'success' ? 'bg-green-500' : 'bg-red-500'} text-white`;
            toastMessage.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            loadPages();
            loadCategories();
        });
    </script>
</body>
</html>
