<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Mạng xã hội - Admin ShopDonk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        
        header { background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
        .logo span { color: #6366f1; }
        .back-btn { color: #94a3b8; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: color 0.3s; }
        .back-btn:hover { color: #6366f1; }
        
        .content { padding: 30px 20px; }
        .page-header { margin-bottom: 30px; }
        .page-header h1 { font-size: 28px; margin-bottom: 10px; }
        .page-header p { color: #94a3b8; }
        
        .social-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        
        .social-card { background: linear-gradient(135deg, #1a1a2e, #16213e); border: 1px solid rgba(99,102,241,0.2); border-radius: 16px; overflow: hidden; transition: all 0.3s; }
        .social-card:hover { border-color: #6366f1; transform: translateY(-2px); }
        
        .social-header { padding: 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .social-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; }
        .social-icon.facebook { background: linear-gradient(135deg, #1877f2, #0d5bbf); }
        .social-icon.youtube { background: linear-gradient(135deg, #ff0000, #cc0000); }
        .social-icon.telegram { background: linear-gradient(135deg, #0088cc, #006699); }
        .social-icon.tiktok { background: linear-gradient(135deg, #000, #333); }
        .social-icon.zalo { background: linear-gradient(135deg, #0068ff, #0050cc); }
        .social-icon.discord { background: linear-gradient(135deg, #5865f2, #4752c4); }
        .social-icon.twitter { background: linear-gradient(135deg, #1da1f2, #0d8bd9); }
        .social-icon.instagram { background: linear-gradient(135deg, #e4405f, #c13584); }
        
        .social-info h3 { font-size: 18px; margin-bottom: 4px; }
        .social-info p { color: #94a3b8; font-size: 13px; }
        
        .social-body { padding: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        .form-group input { width: 100%; padding: 12px 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 14px; transition: all 0.3s; }
        .form-group input:focus { outline: none; border-color: #6366f1; }
        .form-group input::placeholder { color: #64748b; }
        
        .toggle-wrapper { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: rgba(255,255,255,0.03); border-radius: 10px; }
        .toggle-label { font-size: 14px; }
        .toggle { position: relative; width: 50px; height: 26px; background: rgba(255,255,255,0.1); border-radius: 13px; cursor: pointer; transition: all 0.3s; }
        .toggle.active { background: #6366f1; }
        .toggle::after { content: ''; position: absolute; width: 22px; height: 22px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: all 0.3s; }
        .toggle.active::after { left: 26px; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); }
        
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #fff; padding: 12px 24px; border-radius: 10px; font-weight: 600; z-index: 99999; animation: toastIn 0.3s ease; }
        @keyframes toastIn { from { transform: translateX(-50%) translateY(20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
        
        @media (max-width: 768px) {
            .social-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Quay lại</a>
        <div class="logo">🎮 Shop<span>Game</span></div>
        <div></div>
    </header>
    
    <div class="content container">
        <div class="page-header">
            <h1><i class="fas fa-share-alt"></i> Quản lý Mạng xã hội</h1>
            <p>Cấu hình các liên kết mạng xã hội hiển thị trên website</p>
        </div>
        
        <div class="social-grid" id="socialGrid"></div>
        
        <div class="page-header" style="margin-top: 50px;">
            <h1><i class="fas fa-comments"></i> Bong bóng chat hỗ trợ</h1>
            <p>Cấu hình nút chat hiển thị góc dưới bên phải trang web</p>
        </div>
        
        <div class="social-grid" style="grid-template-columns: 1fr;">
            <div class="social-card" id="chatBubbleCard">
                <div class="social-header">
                    <div class="social-icon" style="background: linear-gradient(135deg, #6366f1, #8b5cf6);">
                        <i class="fas fa-comments"></i>
                    </div>
                    <div class="social-info">
                        <h3>Chat hỗ trợ</h3>
                        <p id="chatBubbleUrlPreview">Chưa cấu hình</p>
                    </div>
                </div>
                <div class="social-body">
                    <div class="form-group">
                        <label>URL liên hệ</label>
                        <input type="text" id="chatBubbleUrl" placeholder="contact.html hoặc https://t.me/username">
                        <p style="font-size: 12px; color: #64748b; margin-top: 5px;">Nhập link trang liên hệ hoặc Telegram/Zalo/Messenger</p>
                    </div>
                    <div class="toggle-wrapper">
                        <span class="toggle-label">Hiển thị trên website</span>
                        <div class="toggle" id="chatBubbleToggle" onclick="toggleChatBubble()"></div>
                    </div>
                    <div style="margin-top: 15px; display: flex; gap: 10px;">
                        <button class="btn btn-primary" onclick="saveChatBubble()">
                            <i class="fas fa-save"></i> Lưu
                        </button>
                        <button class="btn btn-secondary" onclick="testChatBubble()">
                            <i class="fas fa-external-link-alt"></i> Test
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const socialPlatforms = [
            { id: 'facebook', name: 'Facebook', icon: 'fab fa-facebook-f', placeholder: 'https://facebook.com/yourpage' },
            { id: 'youtube', name: 'YouTube', icon: 'fab fa-youtube', placeholder: 'https://youtube.com/@yourchannel' },
            { id: 'telegram', name: 'Telegram', icon: 'fab fa-telegram-plane', placeholder: 'https://t.me/yourchannel' },
            { id: 'tiktok', name: 'TikTok', icon: 'fab fa-tiktok', placeholder: 'https://tiktok.com/@youraccount' },
            { id: 'zalo', name: 'Zalo', placeholder: 'Link Zalo Official Account hoặc số điện thoại' },
            { id: 'discord', name: 'Discord', icon: 'fab fa-discord', placeholder: 'https://discord.gg/yourinvite' },
            { id: 'twitter', name: 'Twitter', icon: 'fab fa-twitter', placeholder: 'https://twitter.com/yourhandle' },
            { id: 'instagram', name: 'Instagram', icon: 'fab fa-instagram', placeholder: 'https://instagram.com/yourprofile' }
        ];
        
        const API_BASE = window.location.origin + '/api';
        let socialLinks = JSON.parse(localStorage.getItem('socialLinks')) || {};
        let chatBubbleSettings = { url: 'contact.html', active: true };
        
        document.addEventListener('DOMContentLoaded', async function() {
            await loadChatBubbleSettings();
            renderSocialCards();
            renderChatBubbleCard();
        });
        
        async function loadChatBubbleSettings() {
            try {
                const res = await fetch(`${API_BASE}/payment-settings`);
                const data = await res.json();
                if (data.success && data.data) {
                    chatBubbleSettings = {
                        url: data.data.chat_bubble_url || 'contact.html',
                        active: data.data.chat_bubble_active !== false
                    };
                }
            } catch (e) {
                console.error('Error loading chat bubble settings:', e);
            }
        }
        
        function renderSocialCards() {
            const grid = document.getElementById('socialGrid');
            
            grid.innerHTML = socialPlatforms.map(platform => {
                const link = socialLinks[platform.id] || { url: '', active: false };
                
                return `
                    <div class="social-card">
                        <div class="social-header">
                            <div class="social-icon ${platform.id}">
                                <i class="${platform.icon || 'fas fa-link'}"></i>
                            </div>
                            <div class="social-info">
                                <h3>${platform.name}</h3>
                                <p>${link.url ? link.url.substring(0, 40) + '...' : 'Chưa cấu hình'}</p>
                            </div>
                        </div>
                        <div class="social-body">
                            <div class="form-group">
                                <label>URL liên kết</label>
                                <input type="url" id="url-${platform.id}" value="${link.url || ''}" placeholder="${platform.placeholder}">
                            </div>
                            <div class="toggle-wrapper">
                                <span class="toggle-label">Hiển thị trên website</span>
                                <div class="toggle ${link.active ? 'active' : ''}" id="toggle-${platform.id}" onclick="toggleActive('${platform.id}')"></div>
                            </div>
                            <div style="margin-top: 15px; display: flex; gap: 10px;">
                                <button class="btn btn-primary" onclick="saveLink('${platform.id}')">
                                    <i class="fas fa-save"></i> Lưu
                                </button>
                                ${link.url ? `<button class="btn btn-secondary" onclick="testLink('${platform.id}')"><i class="fas fa-external-link-alt"></i> Test</button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function toggleActive(platformId) {
            const toggle = document.getElementById(`toggle-${platformId}`);
            toggle.classList.toggle('active');
            
            if (!socialLinks[platformId]) {
                socialLinks[platformId] = { url: '', active: false };
            }
            socialLinks[platformId].active = toggle.classList.contains('active');
            localStorage.setItem('socialLinks', JSON.stringify(socialLinks));
        }
        
        function saveLink(platformId) {
            const url = document.getElementById(`url-${platformId}`).value.trim();
            const toggle = document.getElementById(`toggle-${platformId}`);
            
            if (!socialLinks[platformId]) {
                socialLinks[platformId] = { url: '', active: false };
            }
            
            socialLinks[platformId].url = url;
            
            if (url && !socialLinks[platformId].active) {
                toggle.classList.add('active');
                socialLinks[platformId].active = true;
            }
            
            localStorage.setItem('socialLinks', JSON.stringify(socialLinks));
            showToast('Đã lưu thành công!');
            renderSocialCards();
        }
        
        function testLink(platformId) {
            const url = socialLinks[platformId]?.url;
            if (url) {
                window.open(url, '_blank');
            }
        }
        
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function renderChatBubbleCard() {
            document.getElementById('chatBubbleUrl').value = chatBubbleSettings.url;
            document.getElementById('chatBubbleUrlPreview').textContent = chatBubbleSettings.url || 'Chưa cấu hình';
            
            const toggle = document.getElementById('chatBubbleToggle');
            if (chatBubbleSettings.active) {
                toggle.classList.add('active');
            } else {
                toggle.classList.remove('active');
            }
        }
        
        function toggleChatBubble() {
            const toggle = document.getElementById('chatBubbleToggle');
            toggle.classList.toggle('active');
            chatBubbleSettings.active = toggle.classList.contains('active');
        }
        
        async function saveChatBubble() {
            const url = document.getElementById('chatBubbleUrl').value.trim();
            const toggle = document.getElementById('chatBubbleToggle');
            
            chatBubbleSettings.url = url || 'contact.html';
            chatBubbleSettings.active = toggle.classList.contains('active');
            
            try {
                const res = await fetch(`${API_BASE}/payment-settings`);
                const data = await res.json();
                
                let settings = {};
                if (data.success && data.data) {
                    settings = data.data;
                }
                
                settings.chat_bubble_url = chatBubbleSettings.url;
                settings.chat_bubble_active = chatBubbleSettings.active;
                
                const updateRes = await fetch(`${API_BASE}/payment-settings`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(settings)
                });
                
                const updateData = await updateRes.json();
                
                if (updateData.success) {
                    showToast('Đã lưu cấu hình chat bubble!');
                    document.getElementById('chatBubbleUrlPreview').textContent = chatBubbleSettings.url;
                } else {
                    showToast('Lỗi: ' + (updateData.message || 'Không thể lưu'));
                }
            } catch (e) {
                console.error('Error saving chat bubble:', e);
                showToast('Có lỗi xảy ra!');
            }
        }
        
        function testChatBubble() {
            const url = document.getElementById('chatBubbleUrl').value.trim();
            if (url) {
                if (url.startsWith('http')) {
                    window.open(url, '_blank');
                } else {
                    window.open(url, '_blank');
                }
            } else {
                showToast('Vui lòng nhập URL!');
            }
        }
    </script>
</body>
</html>
