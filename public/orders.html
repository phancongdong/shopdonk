<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử mua - ShopDonk</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="logo" style="display:flex;align-items:center;gap:10px;">
                <div class="logo-icon" style="width:40px;height:40px;background:linear-gradient(135deg, #6366f1, #8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;">🎮</div>
                <div class="logo-text" style="font-size:24px;font-weight:800;color:#fff;">Shop<span style="color:#6366f1;">Donk</span></div>
            </a>
        </div>
        <nav class="header-nav">
            <a href="index.html">Trang chủ</a>
            <a href="orders.html" class="active">Lịch sử Mua</a>
            <a href="deposit.html">Nạp tiền</a>
            <a href="transactions.html">Dòng Tiền</a>
            <a href="faq.html">FAQ</a>
        </nav>
        <div class="header-right">
            <div class="user-dropdown">
                <button class="user-btn" id="userBtn">
                    <span class="logo-text" style="font-size: 16px;">🎮 ShopDonk</span>
                    <span class="user-balance" id="userBalance">0 ₫</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="profile.html"><i class="fas fa-user"></i> Thông tin tài khoản</a>
                    <a href="change-password.html"><i class="fas fa-key"></i> Đổi mật khẩu</a>
                    <a href="orders.html"><i class="fas fa-shopping-cart"></i> Đơn hàng</a>
                    <a href="deposit.html"><i class="fas fa-wallet"></i> Nạp tiền</a>
                    <a href="contact.html"><i class="fas fa-headset"></i> Liên hệ</a>
                    <a href="login.html" id="loginLink"><i class="fas fa-sign-in-alt"></i> Đăng nhập</a>
                    <a href="#" id="logoutBtn" style="display:none; color:#ef4444;"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
                </div>
            </div>
        </div>
    </header>

    <section class="content-section">
        <div class="page-header">
            <h1><i class="fas fa-history"></i> Lịch sử Mua Nick</h1>
        </div>
        <div id="ordersContent">
            <div class="coming-soon">
                <i class="fas fa-spinner fa-spin"></i>
                <h2>Đang tải...</h2>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/seo-loader.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const API_BASE = window.location.origin + '/api';
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            const ordersContent = document.getElementById('ordersContent');
            
            if (user) {
                document.getElementById('userBalance').textContent = new Intl.NumberFormat('vi-VN', {style: 'currency', currency: 'VND', maximumFractionDigits: 0}).format(user.balance || 0);
                document.getElementById('loginLink').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
            }
            
            document.getElementById('logoutBtn').addEventListener('click', function(e) {
                e.preventDefault();
                localStorage.removeItem('user');
                localStorage.removeItem('token');
                location.reload();
            });
            
            function formatCurrency(amount) {
                return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND', maximumFractionDigits: 0 }).format(amount);
            }
            
            function formatDate(dateStr) {
                if (!dateStr) return 'N/A';
                return new Date(dateStr).toLocaleString('vi-VN');
            }
            
            if (!user) {
                ordersContent.innerHTML = `
                    <div class="coming-soon">
                        <i class="fas fa-sign-in-alt"></i>
                        <h2>Vui lòng đăng nhập</h2>
                        <p>Đăng nhập để xem Lịch sử mua nick của bạn</p>
                        <a href="login.html" class="btn-primary">Đăng nhập ngay</a>
                    </div>
                `;
                return;
            }
            
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_BASE}/orders`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (res.status === 401) {
                    localStorage.removeItem('user');
                    localStorage.removeItem('token');
                    ordersContent.innerHTML = `
                        <div class="coming-soon">
                            <i class="fas fa-sign-in-alt"></i>
                            <h2>Phiên đăng nhập đã hết hạn</h2>
                            <p>Vui lòng đăng nhập lại</p>
                            <a href="login.html" class="btn-primary">Đăng nhập ngay</a>
                        </div>
                    `;
                    return;
                }
                
                const data = await res.json();
                
                if (data.success && data.data.length > 0) {
                    ordersContent.innerHTML = `
                        <div class="orders-container">
                            <div class="orders-table-wrapper">
                                <table class="orders-table">
                                    <thead>
                                        <tr>
                                            <th>Mã đơn</th>
                                            <th>Sản phẩm</th>
                                            <th>SL</th>
                                            <th>Giá</th>
                                            <th>Tài khoản</th>
                                            <th>Trạng thái</th>
                                            <th>Ngày</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${data.data.map(order => {
                                            const accounts = order.account_info?.accounts || [{username: order.account_username, password: order.account_password}] || [];
                                            const accountsDisplay = accounts.map((a, i) => `<div style="font-size:11px;">#${i+1}: ${a.username}</div>`).join('');
                                            return `
                                            <tr>
                                                <td>#${order.id}</td>
                                                <td>${order.product_name || 'N/A'}</td>
                                                <td>${order.quantity || 1}</td>
                                                <td>${formatCurrency(order.total_price)}</td>
                                                <td><code style="display:block;">${accountsDisplay || 'N/A'}</code></td>
                                                <td><span class="status-${order.status}">${order.status === 'completed' ? 'Hoàn thành' : order.status === 'pending' ? 'Đang xử lý' : 'Đã hủy'}</span></td>
                                                <td>${formatDate(order.created_at)}</td>
                                            </tr>
                                        `}).join('')}
                                    </tbody>
                                </table>
                            </div>
                            <div class="orders-cards">
                                ${data.data.map(order => {
                                    const accounts = order.account_info?.accounts || [{username: order.account_username, password: order.account_password}] || [];
                                    const accountsHtml = accounts.map((a, i) => `
                                        <div style="background:rgba(0,0,0,0.2);padding:8px;border-radius:6px;margin-bottom:6px;">
                                            <div style="color:#6366f1;font-size:11px;margin-bottom:4px;">Nick #${i+1}</div>
                                            <div style="display:flex;justify-content:space-between;margin-bottom:2px;">
                                                <span style="color:#94a3b8;font-size:12px;">TK:</span>
                                                <code style="font-size:11px;">${a.username || 'N/A'}</code>
                                            </div>
                                            <div style="display:flex;justify-content:space-between;">
                                                <span style="color:#94a3b8;font-size:12px;">MK:</span>
                                                <code style="font-size:11px;">${a.password || 'N/A'}</code>
                                            </div>
                                        </div>
                                    `).join('');
                                    return `
                                    <div class="order-card">
                                        <div class="order-card-header">
                                            <span class="order-id">#${order.id}</span>
                                            <span class="status-${order.status}">${order.status === 'completed' ? 'Hoàn thành' : order.status === 'pending' ? 'Đang xử lý' : 'Đã hủy'}</span>
                                        </div>
                                        <div class="order-card-body">
                                            <div class="order-row">
                                                <span class="order-label">Sản phẩm:</span>
                                                <span class="order-value">${order.product_name || 'N/A'}</span>
                                            </div>
                                            <div class="order-row">
                                                <span class="order-label">Số lượng:</span>
                                                <span class="order-value">${order.quantity || 1} nick</span>
                                            </div>
                                            <div class="order-row">
                                                <span class="order-label">Giá:</span>
                                                <span class="order-value price">${formatCurrency(order.total_price)}</span>
                                            </div>
                                            <div class="order-row" style="flex-direction:column;align-items:flex-start;">
                                                <span class="order-label" style="margin-bottom:6px;">Tài khoản:</span>
                                                ${accountsHtml}
                                            </div>
                                            <div class="order-row">
                                                <span class="order-label">Ngày mua:</span>
                                                <span class="order-value">${formatDate(order.created_at)}</span>
                                            </div>
                                        </div>
                                    </div>
                                `}).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    ordersContent.innerHTML = `
                        <div style="background: rgba(30, 41, 59, 0.95); padding: 30px; border-radius: 20px; border: 1px solid rgba(0, 240, 255, 0.3);">
                            <h2 style="color: #fff; margin-bottom: 20px;"><i class="fas fa-history"></i> Lịch sử mua nick</h2>
                            <div style="text-align: center; padding: 40px; color: #a0aec0;">
                                <i class="fas fa-box-open" style="font-size: 50px; color: var(--primary); margin-bottom: 20px;"></i>
                                <p>Bạn chưa có đơn hàng nào</p>
                                <a href="index.html" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px 30px; border-radius: 10px; display: inline-block; margin-top: 20px; text-decoration: none;">Mua nick ngay</a>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                ordersContent.innerHTML = `
                    <div style="background: rgba(30, 41, 59, 0.95); padding: 30px; border-radius: 20px; border: 1px solid rgba(0, 240, 255, 0.3); text-align: center;">
                        <i class="fas fa-exclamation-circle" style="font-size: 50px; color: #ef4444; margin-bottom: 20px;"></i>
                        <p style="color: #fff;">Có lỗi xảy ra khi tải đơn hàng</p>
                        <button onclick="location.reload()" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px 30px; border-radius: 10px; border: none; margin-top: 20px; cursor: pointer;">Thử lại</button>
                    </div>
                `;
            }
        });
    </script>
    <style>
        .orders-container {
            background: rgba(30, 41, 59, 0.95);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }
        
        .orders-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .orders-table th {
            background: rgba(0, 240, 255, 0.1);
            color: var(--primary);
            padding: 15px;
            text-align: left;
            font-size: 14px;
            border-bottom: 2px solid rgba(0, 240, 255, 0.3);
        }
        
        .orders-table td {
            padding: 15px;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .orders-table code {
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 5px;
            color: #00f0ff;
            font-family: 'Courier New', monospace;
        }
        
        .status-completed {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            padding: 5px 10px;
            border-radius: 5px;
        }
        
        .status-pending {
            background: rgba(243, 156, 18, 0.2);
            color: #f39c12;
            padding: 5px 10px;
            border-radius: 5px;
        }
        
        .status-cancelled {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            padding: 5px 10px;
            border-radius: 5px;
        }
        
        .orders-table tbody tr:hover {
            background: rgba(0, 240, 255, 0.05);
        }
        
        .orders-table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .orders-cards {
            display: none;
        }
        
        .order-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .order-id {
            font-weight: 600;
            color: #00f0ff;
            font-size: 16px;
        }
        
        .order-card-body .order-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .order-label {
            color: #94a3b8;
            font-size: 13px;
        }
        
        .order-value {
            color: #fff;
            font-size: 14px;
        }
        
        .order-value.price {
            color: #10b981;
            font-weight: 600;
        }
        
        .order-code {
            background: rgba(99, 102, 241, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            color: #00f0ff;
            font-size: 13px;
        }
        
        @media (max-width: 768px) {
            .orders-container {
                padding: 15px 10px;
            }
            
            .orders-table-wrapper {
                display: none;
            }
            
            .orders-cards {
                display: block;
            }
            
            .page-header h1 {
                font-size: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .order-card {
                padding: 12px;
            }
            
            .order-card-header {
                margin-bottom: 12px;
                padding-bottom: 10px;
            }
            
            .order-id {
                font-size: 15px;
            }
            
            .order-label {
                font-size: 12px;
            }
            
            .order-value {
                font-size: 13px;
            }
            
            .order-code {
                font-size: 12px;
                padding: 3px 6px;
            }
        }
    </style>
</body>
</html>
