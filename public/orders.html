<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử mua - ShopDonk</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/mobile.css">

<body>
    <div class="particles" id="particles"></div>
    
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="logo" style="display:flex;align-items:center;gap:10px;">
                <div class="logo-icon" style="width:40px;height:40px;background:linear-gradient(135deg, #6366f1, #8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;">🎮</div>
                <div class="logo-text" style="font-size:24px;font-weight:800;color:#fff;">Shop<span style="color:#6366f1;">Donk</span></div>
            </a>
        </div>
        <nav class="header-nav">
            <a href="index.html">Trang chủ</a>
            <a href="orders.html" class="active">Lịch sử Mua</a>
            <a href="deposit.html">Nạp tiền</a>
            <a href="transactions.html">Dòng Tiền</a>
            <a href="faq.html">FAQ</a>
        </nav>
        <div class="header-right">
            <div class="user-dropdown">
                <button class="user-btn" id="userBtn">
                    <span class="logo-text" style="font-size: 16px;">🎮 ShopDonk</span>
                    <span class="user-balance" id="userBalance">0 ₫</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="profile.html"><i class="fas fa-user"></i> Thông tin tài khoản</a>
                    <a href="change-password.html"><i class="fas fa-key"></i> Đổi mật khẩu</a>
                    <a href="orders.html"><i class="fas fa-shopping-cart"></i> Đơn hàng</a>
                    <a href="deposit.html"><i class="fas fa-wallet"></i> Nạp tiền</a>
                    <a href="contact.html"><i class="fas fa-headset"></i> Liên hệ</a>
                    <a href="login.html" id="loginLink"><i class="fas fa-sign-in-alt"></i> Đăng nhập</a>
                    <a href="#" id="logoutBtn" style="display:none; color:#ef4444;"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
                </div>
            </div>
        </div>
    </header>

    <section class="content-section">
        <div class="page-header">
            <h1><i class="fas fa-history"></i> Lịch sử Mua Nick</h1>
        </div>
        <div id="ordersContent">
            <div class="coming-soon">
                <i class="fas fa-spinner fa-spin"></i>
                <h2>Đang tải...</h2>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/sanitize.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/seo-loader.js"></script>
    <script>
        const API_BASE = window.location.origin + '/api';
        
        document.addEventListener('DOMContentLoaded', async function() {
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            const ordersContent = document.getElementById('ordersContent');
            
            if (user) {
                document.getElementById('userBalance').textContent = new Intl.NumberFormat('vi-VN', {style: 'currency', currency: 'VND', maximumFractionDigits: 0}).format(user.balance || 0);
                document.getElementById('loginLink').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
            }
            
            document.getElementById('logoutBtn').addEventListener('click', function(e) {
                e.preventDefault();
                localStorage.removeItem('user');
                localStorage.removeItem('token');
                location.reload();
            });
            
            function formatCurrency(amount) {
                return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND', maximumFractionDigits: 0 }).format(amount);
            }
            
            function formatDate(dateStr) {
                if (!dateStr) return 'N/A';
                return new Date(dateStr).toLocaleString('vi-VN');
            }
            
            if (!user) {
                ordersContent.innerHTML = `
                    <div class="coming-soon">
                        <i class="fas fa-sign-in-alt"></i>
                        <h2>Vui lòng đăng nhập</h2>
                        <p>Đăng nhập để xem Lịch sử mua nick của bạn</p>
                        <a href="login.html" class="btn-primary">Đăng nhập ngay</a>
                    </div>
                `;
                return;
            }
            
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_BASE}/orders`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (res.status === 401) {
                    localStorage.removeItem('user');
                    localStorage.removeItem('token');
                    ordersContent.innerHTML = `
                        <div class="coming-soon">
                            <i class="fas fa-sign-in-alt"></i>
                            <h2>Phiên đăng nhập đã hết hạn</h2>
                            <p>Vui lòng đăng nhập lại</p>
                            <a href="login.html" class="btn-primary">Đăng nhập ngay</a>
                        </div>
                    `;
                    return;
                }
                
                const data = await res.json();
                
                if (data.success && data.data.length > 0) {
                    ordersContent.innerHTML = `
                        <div class="orders-container">
                            <div class="orders-table-wrapper">
                                <table class="orders-table">
                                    <thead>
                                        <tr>
                                            <th>Mã đơn</th>
                                            <th>Sản phẩm</th>
                                            <th>SL</th>
                                            <th>Giá</th>
                                            <th>Tài khoản</th>
                                            <th>Trạng thái</th>
                                            <th>Ngày</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${data.data.map(order => {
                                            const hasCredentials = order.account_info || order.account_username;
                                            return `
                                            <tr>
                                                <td>#${order.id}</td>
                                                <td>${order.product_name || 'N/A'}</td>
                                                <td>${order.quantity || 1}</td>
                                                <td>${formatCurrency(order.total_price)}</td>
                                                <td>
                                                    ${order.status === 'completed' ? 
                                                        `<button class="view-account-btn" data-order-id="${order.id}" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:4px 12px;border-radius:6px;font-size:11px;border:none;cursor:pointer;">
                                                            <i class="fas fa-eye"></i> Xem tài khoản
                                                        </button>
                                                        <div id="accounts-${order.id}" style="display:none;margin-top:8px;"></div>` : 
                                                        `<span style="color:#94a3b8;">-</span>`
                                                    }
                                                </td>
                                                <td><span class="status-${order.status}">${order.status === 'completed' ? 'Hoàn thành' : order.status === 'pending' ? 'Đang xử lý' : 'Đã hủy'}</span></td>
                                                <td>${formatDate(order.created_at)}</td>
                                            </tr>
                                        `}).join('')}
                                    </tbody>
                                </table>
                            </div>
                            <div class="orders-cards">
                                ${data.data.map(order => {
                                    return `
                                    <div class="order-card">
                                        <div class="order-card-header">
                                            <span class="order-id">#${order.id}</span>
                                            <span class="status-${order.status}">${order.status === 'completed' ? 'Hoàn thành' : order.status === 'pending' ? 'Đang xử lý' : 'Đã hủy'}</span>
                                        </div>
                                        <div class="order-card-body">
                                            <div class="order-row">
                                                <span class="order-label">Sản phẩm:</span>
                                                <span class="order-value">${order.product_name || 'N/A'}</span>
                                            </div>
                                            <div class="order-row">
                                                <span class="order-label">Số lượng:</span>
                                                <span class="order-value">${order.quantity || 1} nick</span>
                                            </div>
                                            <div class="order-row">
                                                <span class="order-label">Giá:</span>
                                                <span class="order-value price">${formatCurrency(order.total_price)}</span>
                                            </div>
                                            <div class="order-row" style="flex-direction:column;align-items:flex-start;">
                                                <span class="order-label" style="margin-bottom:6px;">Tài khoản:</span>
                                                ${order.status === 'completed' ? 
                                                    `<button class="view-account-btn card-view-btn" data-order-id="${order.id}" style="width:100%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:10px;border-radius:8px;font-size:13px;border:none;cursor:pointer;">
                                                        <i class="fas fa-eye"></i> Xem tài khoản (${order.quantity || 1} nick)
                                                    </button>
                                                    <div id="accounts-${order.id}" style="display:none;width:100%;margin-top:8px;"></div>` : 
                                                    `<span style="color:#94a3b8;font-size:12px;">Đơn hàng chưa hoàn thành</span>`
                                                }
                                            </div>
                                            <div class="order-row">
                                                <span class="order-label">Ngày mua:</span>
                                                <span class="order-value">${formatDate(order.created_at)}</span>
                                            </div>
                                        </div>
                                    </div>
                                `}).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    ordersContent.innerHTML = `
                        <div class="empty-state">
                            <h2><i class="fas fa-history"></i> Lịch sử mua nick</h2>
                            <div class="empty-state-content">
                                <i class="fas fa-box-open"></i>
                                <p>Bạn chưa có đơn hàng nào</p>
                                <a href="index.html" class="empty-state-btn">Mua nick ngay</a>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                ordersContent.innerHTML = `
                    <div class="error-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Có lỗi xảy ra khi tải đơn hàng</p>
                        <button onclick="location.reload()" class="retry-btn">Thử lại</button>
                    </div>
                `;
            }
        });
        
        document.addEventListener('click', async function(e) {
            const btn = e.target.closest('.view-account-btn');
            if (!btn) return;
            
            const orderId = btn.dataset.orderId;
            const isMobileView = btn.classList.contains('card-view-btn');
            
            if (isMobileView) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tải...';
                
                try {
                    const token = localStorage.getItem('token');
                    const res = await fetch(`${API_BASE}/orders/${orderId}/account`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    const data = await res.json();
                    
                    if (data.success) {
                        const accounts = data.data.accounts || [];
                        showAccountModal(orderId, accounts);
                        btn.innerHTML = '<i class="fas fa-eye"></i> Xem tài khoản';
                    } else {
                        showToast(data.message || 'Không thể xem tài khoản');
                        btn.innerHTML = '<i class="fas fa-eye"></i> Xem tài khoản';
                    }
                } catch (error) {
                    console.error('Error fetching accounts:', error);
                    showToast('Lỗi khi tải tài khoản');
                    btn.innerHTML = '<i class="fas fa-eye"></i> Xem tài khoản';
                }
                
                btn.disabled = false;
                return;
            }
            
            const accountsContainer = document.getElementById(`accounts-${orderId}`);
            
            if (accountsContainer && accountsContainer.style.display === 'block') {
                accountsContainer.style.display = 'none';
                btn.innerHTML = '<i class="fas fa-eye"></i> Xem tài khoản';
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tải...';
            
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_BASE}/orders/${orderId}/account`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await res.json();
                
                if (data.success) {
                    const accounts = data.data.accounts || [];
                    const accountsHtml = accounts.map((a, i) => `
                        <div class="account-item">
                            <div class="account-item-title">Nick #${i+1}</div>
                            <div class="credential-row">
                                <span class="credential-label">TK:</span>
                                <code class="credential-value">${escapeHtml(a.username || 'N/A')}</code>
                                <button class="copy-btn-mobile" onclick="handleCopyToClipboard('${escapeJs(a.username || '')}', this)">📋</button>
                            </div>
                            <div class="credential-row">
                                <span class="credential-label">MK:</span>
                                <code class="credential-value">${escapeHtml(a.password || 'N/A')}</code>
                                <button class="copy-btn-mobile" onclick="handleCopyToClipboard('${escapeJs(a.password || '')}', this)">📋</button>
                            </div>
                        </div>
                    `).join('');
                    
                     if (accountsContainer) {
                        accountsContainer.innerHTML = accountsHtml;
                        accountsContainer.style.display = 'block';
                        accountsContainer.style.maxHeight = '300px';
                        accountsContainer.style.overflowY = 'auto';
                        accountsContainer.style.padding = '10px';
                        accountsContainer.style.background = 'rgba(0,0,0,0.3)';
                        accountsContainer.style.borderRadius = '8px';
                        accountsContainer.style.marginTop = '10px';
                    } else {
                        showAccountModal(orderId, accounts);
                    }
                    
                    btn.innerHTML = '<i class="fas fa-eye-slash"></i> Ẩn tài khoản';
                } else {
                    showToast(data.message || 'Không thể xem tài khoản');
                    btn.innerHTML = '<i class="fas fa-eye"></i> Xem tài khoản';
                }
            } catch (error) {
                console.error('Error fetching accounts:', error);
                showToast('Lỗi khi tải tài khoản');
                btn.innerHTML = '<i class="fas fa-eye"></i> Xem tài khoản';
            }
            
            btn.disabled = false;
        });
        
        async function handleCopyToClipboard(text, btn) {
            if (!text) {
                showToast('Không có dữ liệu để copy');
                return;
            }
            
            const success = await copyToClipboard(text);
            
            if (success) {
                btn.innerHTML = '✓';
                btn.classList.add('copied');
                showToast('Đã copy!');
                
                setTimeout(() => {
                    btn.innerHTML = '📋';
                    btn.classList.remove('copied');
                }, 2000);
            } else {
                showToast('Copy thất bại, vui lòng copy thủ công');
            }
        }
        
        async function copyToClipboard(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
                
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.top = '0';
                textarea.style.left = '0';
                textarea.style.opacity = '0';
                textarea.style.fontSize = '16px';
                textarea.setAttribute('readonly', '');
                document.body.appendChild(textarea);
                
                textarea.select();
                textarea.setSelectionRange(0, 99999);
                
                const success = document.execCommand('copy');
                document.body.removeChild(textarea);
                
                return success;
            } catch (e) {
                console.error('Copy failed:', e);
                return false;
            }
        }
        
        function showToast(message) {
            const existingToast = document.querySelector('.toast-notification');
            if (existingToast) {
                existingToast.remove();
            }
            
            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        function showAccountModal(orderId, accounts) {
            const existingModal = document.querySelector('.account-modal');
            if (existingModal) existingModal.remove();
            
            const accountsHtml = accounts.map((a, i) => `
                <div class="account-item">
                    <div class="account-item-title">Nick #${i+1}</div>
                    <div class="credential-row">
                        <span class="credential-label">TK:</span>
                        <code class="credential-value">${escapeHtml(a.username || 'N/A')}</code>
                        <button class="copy-btn-mobile" onclick="handleCopyToClipboard('${escapeJs(a.username || '')}', this)">📋</button>
                    </div>
                    <div class="credential-row">
                        <span class="credential-label">MK:</span>
                        <code class="credential-value">${escapeHtml(a.password || 'N/A')}</code>
                        <button class="copy-btn-mobile" onclick="handleCopyToClipboard('${escapeJs(a.password || '')}', this)">📋</button>
                    </div>
                </div>
            `).join('');
            
            const modal = document.createElement('div');
            modal.className = 'account-modal';
            modal.innerHTML = `
                <div class="account-modal-overlay" onclick="closeAccountModal()"></div>
                <div class="account-modal-content">
                    <div class="account-modal-header">
                        <h3>Tài khoản đơn hàng #${orderId}</h3>
                        <button class="account-modal-close" onclick="closeAccountModal()">✕</button>
                    </div>
                    <div class="account-modal-body">
                        ${accountsHtml}
                    </div>
                    <div class="account-modal-footer">
                        <p style="color:#f39c12;font-size:12px;margin:0;">
                            <i class="fas fa-exclamation-triangle"></i> 
                            Lưu ý: Vui lòng lưu thông tin tài khoản trước khi đóng!
                        </p>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            document.body.style.overflow = 'hidden';
        }
        
        function closeAccountModal() {
            const modal = document.querySelector('.account-modal');
            if (modal) {
                modal.remove();
                document.body.style.overflow = '';
            }
        }
    </script>

    <script>
        gsap.registerPlugin(ScrollTrigger);
        document.addEventListener('DOMContentLoaded', function() {
            gsap.from('.header', { y: -50, opacity: 0, duration: 0.8, ease: "power3.out" });
            gsap.from('.page-header', { y: 30, opacity: 0, duration: 0.6, delay: 0.3 });
            gsap.from('#ordersContent', { y: 40, opacity: 0, duration: 0.7, delay: 0.5, ease: "power2.out" });
        });
        
        // Touch event optimization for mobile
        let touchStartTime = 0;
        let touchStartTarget = null;
        
        document.addEventListener('touchstart', function(e) {
            touchStartTime = Date.now();
            touchStartTarget = e.target;
        }, { passive: true });
        
        document.addEventListener('touchend', async function(e) {
            if (Date.now() - touchStartTime > 500) return;
            
            const btn = e.target.closest('.view-account-btn');
            if (!btn) return;
            
            e.preventDefault();
        }, { passive: false });
    </script>
