<!DOCTYPE html>
<html lang='vi'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Đổi mật khẩu - ShopGame</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css'>
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap' rel='stylesheet'>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 450px; width: 100%; }
        .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px 30px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #fff; font-size: 28px; font-weight: 800; }
        .logo h1 span { color: #6366f1; }
        h2 { color: #fff; font-size: 24px; margin-bottom: 25px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #94a3b8; margin-bottom: 8px; font-weight: 500; }
        .input-wrapper { position: relative; }
        .input-wrapper input { width: 100%; padding: 14px 45px 14px 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; background: rgba(255,255,255,0.05); color: #fff; font-size: 15px; transition: all 0.3s; }
        .input-wrapper input:focus { outline: none; border-color: #6366f1; background: rgba(255,255,255,0.1); }
        .input-wrapper i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #64748b; cursor: pointer; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(99,102,241,0.3); }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: #6366f1; text-decoration: none; font-weight: 500; }
        .links a:hover { text-decoration: underline; }
        .alert { padding: 12px 15px; border-radius: 10px; margin-bottom: 20px; font-weight: 500; }
        .alert-success { background: rgba(34,197,94,0.2); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
        .alert-error { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
        .loading { display: none; text-align: center; }
        .loading i { color: #6366f1; font-size: 30px; }
    </style>
</head>
<body>
    <div class='container'>
        <div class='card'>
            <div class='logo'>
                <h1>Shop<span>Game</span></h1>
            </div>
            <h2>Đổi mật khẩu</h2>
            <div id='alert'></div>
            <form id='changePasswordForm'>
                <div class='form-group'>
                    <label>Mật khẩu hiện tại</label>
                    <div class='input-wrapper'>
                        <input type='password' id='currentPassword' required placeholder='Nhập mật khẩu hiện tại'>
                        <i class='fas fa-eye' onclick='togglePassword(this, \"currentPassword\")'></i>
                    </div>
                </div>
                <div class='form-group'>
                    <label>Mật khẩu mới</label>
                    <div class='input-wrapper'>
                        <input type='password' id='newPassword' required placeholder='Nhập mật khẩu mới'>
                        <i class='fas fa-eye' onclick='togglePassword(this, \"newPassword\")'></i>
                    </div>
                </div>
                <div class='form-group'>
                    <label>Xác nhận mật khẩu mới</label>
                    <div class='input-wrapper'>
                        <input type='password' id='confirmPassword' required placeholder='Nhập lại mật khẩu mới'>
                        <i class='fas fa-eye' onclick='togglePassword(this, \"confirmPassword\")'></i>
                    </div>
                </div>
                <button type='submit' class='btn btn-primary'>Đổi mật khẩu</button>
            </form>
            <div class='loading' id='loading'><i class='fas fa-spinner fa-spin'></i></div>
            <div class='links'>
                <a href='index.html'>Về trang chủ</a>
            </div>
        </div>
    </div>
    <script>
        const API_BASE = 'http://localhost:3000/api';
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (!user) location.href = 'login.html';
        
        function togglePassword(icon, inputId) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
        
        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = 'alert alert-' + type;
            alert.textContent = message;
            alert.style.display = 'block';
        }
        
        document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                showAlert('error', 'Mật khẩu xác nhận không khớp!');
                return;
            }
            
            if (newPassword.length < 6) {
                showAlert('error', 'Mật khẩu mới phải có ít nhất 6 ký tự!');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            
            try {
                const res = await fetch(API_BASE + '/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: user.id, currentPassword, newPassword })
                });
                
                const data = await res.json();
                document.getElementById('loading').style.display = 'none';
                
                if (data.success) {
                    showAlert('success', 'Đổi mật khẩu thành công!');
                    document.getElementById('changePasswordForm').reset();
                } else {
                    showAlert('error', data.message || 'Đổi mật khẩu thất bại!');
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showAlert('error', 'Có lỗi xảy ra!');
            }
        });
    </script>
</body>
</html>
