<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin tài khoản - ShopDonk</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/mobile.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; width: 100%; box-sizing: border-box; }
        header { background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%); border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 100; }
        .header-content { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .logo-text { font-size: 24px; font-weight: 800; color: #fff; }
        .logo-text span { color: #6366f1; }
        .nav-menu { display: flex; gap: 30px; }
        .nav-menu a { color: #94a3b8; font-weight: 500; transition: color 0.3s; }
        .nav-menu a:hover { color: #6366f1; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .lang-selector { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer; }
        .lang-selector img { width: 20px; height: 14px; }
        .user-btn { display: flex; align-items: center; gap: 10px; padding: 10px 20px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 10px; color: #fff; font-weight: 600; cursor: pointer; position: relative; }
        .user-balance { color: #fbbf24; }
        .user-dropdown { position: absolute; top: 100%; right: 0; margin-top: 10px; background: linear-gradient(135deg, #1a1a2e, #16213e); border: 1px solid rgba(99,102,241,0.3); border-radius: 12px; min-width: 200px; display: none; overflow: hidden; }
        .user-dropdown.show { display: block; }
        .user-dropdown a { display: flex; align-items: center; gap: 12px; padding: 14px 20px; color: #94a3b8; transition: all 0.3s; }
        .user-dropdown a:hover { background: rgba(99,102,241,0.1); color: #fff; }
        .user-dropdown a i { width: 20px; color: #6366f1; }
        .user-dropdown a.logout { color: #ef4444; border-top: 1px solid rgba(255,255,255,0.1); }
        .user-dropdown a.logout i { color: #ef4444; }
        .profile-container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .page-header { text-align: center; margin-bottom: 30px; }
        .page-header h1 { font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .profile-card { background: linear-gradient(135deg, #1a1a2e, #16213e); border: 1px solid rgba(99,102,241,0.2); border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(99,102,241,0.2); }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 36px; color: white; }
        .profile-name { font-size: 24px; font-weight: 600; }
        .profile-email { color: #94a3b8; margin-top: 5px; }
        .profile-info-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .profile-info-label { color: #94a3b8; display: flex; align-items: center; gap: 10px; }
        .profile-info-value { color: #fff; font-weight: 500; }
        .profile-balance { color: #22c55e; font-size: 20px; font-weight: bold; }
        .edit-btn { background: rgba(99,102,241,0.2); border: 1px solid rgba(99,102,241,0.3); color: #6366f1; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .edit-btn:hover { background: rgba(99,102,241,0.4); transform: scale(1.1); }
        .profile-actions { margin-top: 30px; display: flex; gap: 15px; flex-wrap: wrap; }
        .profile-btn { flex: 1; min-width: 150px; padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s; }
        .btn-deposit { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
        .btn-deposit:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(99,102,241,0.4); }
        .btn-logout { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
        .btn-logout:hover { background: rgba(239,68,68,0.3); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); }
        .coming-soon { text-align: center; padding: 60px 20px; }
        .coming-soon i { font-size: 60px; color: #6366f1; margin-bottom: 20px; }
        .coming-soon h2 { margin-bottom: 10px; }
        .coming-soon p { color: #94a3b8; margin-bottom: 20px; }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; padding: 12px 30px; border-radius: 10px; display: inline-block; font-weight: 600; transition: all 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(99,102,241,0.4); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); display: flex; justify-content: center; align-items: center; z-index: 10000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.show { opacity: 1; pointer-events: all; }
        .edit-modal { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 30px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); transform: scale(0.8); transition: transform 0.3s ease; max-width: 400px; width: 90%; border: 1px solid rgba(99,102,241,0.3); }
        .modal-overlay.show .edit-modal { transform: scale(1); }
        .edit-modal h3 { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .edit-modal input { width: 100%; padding: 12px 15px; border: 1px solid rgba(99,102,241,0.3); border-radius: 8px; background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; margin-bottom: 15px; }
        .edit-modal input:focus { outline: none; border-color: #6366f1; }
        .edit-modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .edit-modal-buttons button { flex: 1; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .btn-save { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: #a0aec0; }
        @media (max-width: 768px) { .nav-menu { display: none; } .profile-header { flex-direction: column; text-align: center; } .profile-info-item { flex-direction: column; gap: 10px; align-items: flex-start; } .profile-actions { flex-direction: column; } }
    </style>
</head>
<body>
    <header>
        <div class="header-content container">
            <a href="index.html" class="logo" style="display:flex;align-items:center;gap:10px;">
                <div class="logo-icon">🎮</div>
                <div class="logo-text">Shop<span>Donk</span></div>
            </a>
            <nav class="nav-menu">
                <a href="index.html">Trang chủ</a>
                <a href="orders.html">Lịch sử</a>
                <a href="deposit.html">Nạp tiền</a>
                <a href="transactions.html">Giao dịch</a>
                <a href="faq.html">FAQ</a>
            </nav>
            <div class="header-right">
                <div class="lang-selector">
                    <img src="https://flagcdn.com/w40/vn.png" alt="VN">
                    <span>VI | VND</span>
                </div>
                <div class="user-btn" id="userBtn">
                    <span id="userName">Đăng nhập</span>
                    <span class="user-balance" id="userBalance"></span>
                    <i class="fas fa-chevron-down"></i>
                    <div class="user-dropdown" id="userDropdown">
                        <a href="profile.html"><i class="fas fa-user"></i> Thông tin tài khoản</a>
                        <a href="change-password.html"><i class="fas fa-key"></i> Đổi mật khẩu</a>
                        <a href="orders.html"><i class="fas fa-shopping-cart"></i> Đơn hàng của tôi</a>
                        <a href="deposit.html"><i class="fas fa-wallet"></i> Nạp tiền</a>
                        <a href="transactions.html"><i class="fas fa-exchange-alt"></i> Lịch sử giao dịch</a>
                        <a href="#" class="logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <div class="profile-container">
        <div class="page-header">
            <h1><i class="fas fa-user"></i> Thông Tin Tài Khoản</h1>
        </div>
        <div id="profileContent"></div>
    </div>
    <div class="modal-overlay" id="editModal">
        <div class="edit-modal">
            <h3><i class="fas fa-edit"></i> <span id="modalTitle">Thay đổi</span></h3>
            <input type="text" id="newValue" placeholder="Nhập giá trị mới">
            <input type="password" id="confirmPassword" placeholder="Nhập mật khẩu để xác nhận">
            <div class="edit-modal-buttons">
                <button class="btn-cancel" onclick="closeEditModal()">Hủy</button>
                <button class="btn-save" onclick="saveField()">Lưu</button>
            </div>
        </div>
    </div>
    <script>
        const API_BASE = window.location.origin + '/api';
        let currentField = '';
        document.addEventListener('DOMContentLoaded', function() {
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            const profileContent = document.getElementById('profileContent');
            if (user) {
                document.getElementById('userName').textContent = user.name || 'User';
                document.getElementById('userBalance').textContent = formatCurrency(user.balance || 0);
            }
            const userBtn = document.getElementById('userBtn');
            const userDropdown = document.getElementById('userDropdown');
            userBtn.addEventListener('click', (e) => {
                if (user) { userDropdown.classList.toggle('show'); e.stopPropagation(); }
                else { location.href = 'login.html'; }
            });
            document.addEventListener('click', () => { userDropdown.classList.remove('show'); });
            document.getElementById('logoutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('user');
                location.reload();
            });
            if (user) {
                const roleText = user.role === 'admin' ? 'Quản trị viên' : user.role === 'ctv' ? 'Cộng tác viên' : 'Thành viên';
                const roleClass = user.role === 'admin' ? 'style="color:#a855f7"' : user.role === 'ctv' ? 'style="color:#3b82f6"' : '';
                const showAdminBtn = user.role === 'admin' || user.role === 'ctv';
                profileContent.innerHTML = '<div class="profile-card"><div class="profile-header"><div class="profile-avatar"><i class="fas fa-user"></i></div><div><div class="profile-name">' + user.name + '</div><div class="profile-email">' + (user.email || 'Chưa có email') + '</div></div></div><div class="profile-info-item"><div class="profile-info-label"><i class="fas fa-wallet"></i> Số dư tài khoản</div><div class="profile-balance">' + formatCurrency(user.balance || 0) + '</div></div><div class="profile-info-item"><div class="profile-info-label"><i class="fas fa-user-circle"></i> ID tài khoản</div><div class="profile-info-value">#' + user.id + '</div></div><div class="profile-info-item"><div class="profile-info-label"><i class="fas fa-calendar"></i> Ngày đăng ký</div><div class="profile-info-value">' + formatDate(user.created_at) + '</div></div><div class="profile-info-item"><div class="profile-info-label"><i class="fas fa-envelope"></i> Email</div><div class="profile-info-value" id="userEmail">' + (user.email || 'Chưa có email') + '</div><button class="edit-btn" onclick="openEditModal(\'email\')" title="Thay đổi email"><i class="fas fa-edit"></i></button></div><div class="profile-info-item"><div class="profile-info-label"><i class="fas fa-phone"></i> Số điện thoại</div><div class="profile-info-value" id="userPhone">' + (user.phone || 'Chưa có số điện thoại') + '</div><button class="edit-btn" onclick="openEditModal(\'phone\')" title="Thay đổi số điện thoại"><i class="fas fa-edit"></i></button></div><div class="profile-info-item"><div class="profile-info-label"><i class="fas fa-shield-alt"></i> Vai trò</div><div class="profile-info-value" ' + roleClass + '>' + roleText + '</div></div>' + (showAdminBtn ? '<div class="profile-info-item"><div class="profile-info-label"><i class="fas fa-tools"></i> Quản trị</div><a href="admin/index.html" class="btn-deposit" style="min-width:auto;padding:8px 20px;font-size:14px;text-decoration:none;"><i class="fas fa-cog"></i> Vào trang quản trị</a></div>' : '') + '<div class="profile-actions"><a href="deposit.html" class="profile-btn btn-deposit"><i class="fas fa-plus"></i> Nạp tiền</a><a href="orders.html" class="profile-btn btn-secondary"><i class="fas fa-shopping-cart"></i> Lịch sử mua</a><a href="change-password.html" class="profile-btn btn-secondary"><i class="fas fa-key"></i> Đổi mật khẩu</a><button id="logoutBtn2" class="profile-btn btn-logout"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button></div></div>';
                document.getElementById('logoutBtn2').addEventListener('click', function() {
                    localStorage.removeItem('user');
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                });
            } else {
                profileContent.innerHTML = '<div class="profile-card"><div class="coming-soon"><i class="fas fa-sign-in-alt"></i><h2>Vui lòng đăng nhập</h2><p>Đăng nhập để xem thông tin tài khoản của bạn</p><a href="login.html" class="btn-primary">Đăng nhập ngay</a></div></div>';
            }
        });
        function formatCurrency(amount) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND', maximumFractionDigits: 0 }).format(amount); }
        function formatDate(dateStr) { if (!dateStr) return 'N/A'; return new Date(dateStr).toLocaleDateString('vi-VN', { year: 'numeric', month: 'long', day: 'numeric' }); }
        function openEditModal(field) {
            currentField = field;
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            const modal = document.getElementById('editModal');
            const title = document.getElementById('modalTitle');
            const input = document.getElementById('newValue');
            title.textContent = field === 'email' ? 'Thay đổi Email' : 'Thay đổi Số điện thoại';
            input.value = user[field] || '';
            input.type = field === 'email' ? 'email' : 'tel';
            input.placeholder = field === 'email' ? 'Nhập email mới' : 'Nhập số điện thoại mới';
            modal.classList.add('show');
        }
        function closeEditModal() { document.getElementById('editModal').classList.remove('show'); }
        document.getElementById('editModal').addEventListener('click', function(e) { if (e.target === this) closeEditModal(); });
        async function saveField() {
            const newValue = document.getElementById('newValue').value.trim();
            const password = document.getElementById('confirmPassword').value;
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            if (!password) { alert('Vui lòng nhập mật khẩu!'); return; }
            if (currentField === 'email' && newValue && !newValue.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) { alert('Email không hợp lệ!'); return; }
            try {
                const response = await fetch(API_BASE + '/auth/profile/' + user.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ [currentField]: newValue || null, password: password }) });
                const data = await response.json();
                if (response.ok) {
                    user[currentField] = newValue;
                    localStorage.setItem('user', JSON.stringify(user));
                    const elementId = currentField === 'email' ? 'userEmail' : 'userPhone';
                    document.getElementById(elementId).textContent = newValue || 'Chưa có';
                    closeEditModal();
                    alert('Cập nhật thành công!');
                } else { alert(data.message || 'Cập nhật thất bại!'); }
            } catch (error) { console.error('Error:', error); alert('Có lỗi xảy ra!'); }
        }
    </script>
    <script src="js/seo-loader.js"></script>
</body>
</html>
