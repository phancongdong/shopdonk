<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - ShopDonk</title>
    <meta name="description" content="Đăng ký tài khoản ShopDonk miễn phí để mua bán tài khoản game uy tín.">
    <meta name="keywords" content="đăng ký shopdonk, register, tạo tài khoản mua acc game">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://shopdonk.com/register.html">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
    <meta property="og:title" content="Đăng ký - ShopDonk">
    <meta property="og:description" content="Đăng ký tài khoản ShopDonk miễn phí">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <span class="logo-text">🎮 ShopDonk</span>
                </a>
                <h1>Đăng ký</h1>
                <p>Tạo tài khoản mới</p>
            </div>

            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="name">
                        <i class="fas fa-user"></i>
                        Tên người dùng
                    </label>
                    <input type="text" id="name" name="name" placeholder="nhập tên người dùng" required>
                </div>

                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        Email (không bắt buộc)
                    </label>
                    <input type="email" id="email" name="email" placeholder="nhập email của bạn">
                </div>

                <div class="form-group">
                    <label for="phone">
                        <i class="fas fa-phone"></i>
                        Số điện thoại (không bắt buộc)
                    </label>
                    <input type="tel" id="phone" name="phone" placeholder="nhập số điện thoại">
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        mật khẩu
                    </label>
                    <input type="password" id="password" name="password" placeholder="nhập mật khẩu (tối thiểu 6 ký tự)" required minlength="6">
                    <button type="button" class="toggle-password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-lock"></i>
                        Xác Nhận mật khẩu
                    </label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="nhập lại mật khẩu" required>
                </div>

                <label class="checkbox-label">
                    <input type="checkbox" name="agreeTerms" required>
                    <span>Tôi đồng ý với <a href="#" style="color: var(--primary-color);">Điều khoản dịch vụ</a></span>
                </label>

                <button type="submit" class="auth-btn">
                    <i class="fas fa-user-plus"></i>
                    Đăng ký
                </button>

                <div class="auth-divider">
                    <span>hoặc đăng ký với</span>
                </div>

                <div class="social-auth">
                    <button type="button" class="social-btn google">
                        <i class="fab fa-google"></i>
                        Google
                    </button>
                    <button type="button" class="social-btn facebook">
                        <i class="fab fa-facebook-f"></i>
                        Facebook
                    </button>
                </div>

                <p class="auth-footer">
                    Đã có tài khoản? <a href="login.html">Đăng nhập</a>
                </p>
            </form>
        </div>

        <div class="auth-banner">
            <div class="banner-content">
                <h2>🎮 ShopDonk</h2>
                <p>Tham gia cùng đăng game thủ Việt Nam</p>
                <ul>
                    <li><i class="fas fa-gift"></i> Nhận ưu đãi khi Đăng ký</li>
                    <li><i class="fas fa-shield-alt"></i> bảo mật 2 lớp</li>
                    <li><i class="fas fa-headset"></i> hỗ trợ nhiệt tình</li>
                    <li><i class="fas fa-wallet"></i> Quản lý tài chính dễ dàng</li>
                </ul>
            </div>
        </div>
    </div>
    
    <script src="js/seo-loader.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/particles.js"></script>
</body>
</html>
